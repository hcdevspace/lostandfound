{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="registration-container">
  <div class="registration-card">
    <div class="registration-header">
      <div class="registration-icon"><i class="fas fa-check-circle"></i></div>
      <h1 class="registration-title">Password Reset!</h1>
      <p class="registration-subtitle">Your password has been updated</p>
    </div>
    <div class="registration-form" style="text-align:center;padding:24px 0;">
      <p style="font-size:15px;line-height:1.6;">Your password has been set. You can now log in with your new password.</p>
    </div>
    <div class="registration-footer">
      <p><a href="{% url 'login' %}" class="registration-button" style="display:inline-block;text-decoration:none;"><i class="fas fa-sign-in-alt"></i> Go to Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
