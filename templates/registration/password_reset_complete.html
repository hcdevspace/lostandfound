{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="lf-grid-bg" aria-hidden="true"></div>

<div class="lf-auth-outer">
    <div class="lf-auth-card">
        <div class="lf-auth-header">
            <div class="lf-auth-icon" style="background: rgba(22,163,74,0.1); color: var(--success-color);">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="lf-auth-title">Password Reset!</h1>
            <p class="lf-auth-sub">Your password has been updated</p>
        </div>

        <div class="lf-auth-form" style="text-align: center;">
            <p style="font-size: 0.95rem; line-height: 1.65; color: var(--text-dark);">Your password has been set. You can now log in with your new password.</p>
        </div>

        <div class="lf-auth-footer">
            <a href="{% url 'login' %}" class="lf-auth-btn" style="display: block; text-decoration: none; text-align: center;">
                <i class="fas fa-sign-in-alt"></i> Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
