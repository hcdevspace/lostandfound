{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="lf-grid-bg" aria-hidden="true"></div>

<div class="lf-auth-outer">
    <div class="lf-auth-card">
        <div class="lf-auth-header">
            <div class="lf-auth-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="lf-auth-title">Forgot Password</h1>
            <p class="lf-auth-sub">Enter your email to receive a reset link</p>
        </div>

        <form method="POST" class="lf-auth-form">
            {% csrf_token %}
            <div class="lf-auth-field">
                <label class="lf-auth-label">Email Address <span class="lf-auth-required">*</span></label>
                <input type="email" name="email" class="lf-auth-input" placeholder="your.email@school.edu" required autofocus>
                <span class="lf-auth-hint">Enter the email address associated with your account.</span>
            </div>
            <button type="submit" class="lf-auth-btn">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <div class="lf-auth-footer">
            <p class="lf-auth-link-row">Remember your password? <a href="{% url 'login' %}" class="lf-auth-link">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
