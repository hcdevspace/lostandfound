{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="registration-container">
  <div class="registration-card">
    <div class="registration-header">
      <div class="registration-icon"><i class="fas fa-key"></i></div>
      <h1 class="registration-title">Forgot Password</h1>
      <p class="registration-subtitle">Enter your email to receive a reset link</p>
    </div>
    <form method="POST" class="registration-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" name="email" class="form-control" placeholder="your.email@school.edu" required autofocus>
        <small class="form-text">Enter the email address associated with your account.</small>
      </div>
      <button type="submit" class="registration-button">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>
    <div class="registration-footer">
      <p>Remember your password? <a href="{% url 'login' %}" class="registration-link">Back to Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
