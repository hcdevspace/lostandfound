{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="lf-grid-bg" aria-hidden="true"></div>

<div class="lf-auth-outer">
    <div class="lf-auth-card">
        <div class="lf-auth-header">
            <div class="lf-auth-icon">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h1 class="lf-auth-title">Welcome back</h1>
            <p class="lf-auth-sub">Log in to your account</p>
        </div>

        <form method="POST" class="lf-auth-form">
            {% csrf_token %}

            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="lf-auth-field">
                <label class="lf-auth-label">Username <span class="lf-auth-required">*</span></label>
                <input type="text" name="username" class="lf-auth-input" placeholder="Enter your username" required autofocus>
            </div>

            <div class="lf-auth-field">
                <label class="lf-auth-label">Password <span class="lf-auth-required">*</span></label>
                <input type="password" name="password" class="lf-auth-input" placeholder="Enter your password" required>
            </div>

            <div class="lf-auth-field">
                <label class="lf-auth-check">
                    <input type="checkbox" name="remember_me"> Remember me
                </label>
            </div>

            <button type="submit" class="lf-auth-btn">Log in</button>
        </form>

        <div class="lf-auth-footer">
            <p class="lf-auth-footer-text">Don't have an account?</p>
            <div class="lf-auth-alt-btns">
                <a href="{% url 'register_student' %}" class="lf-auth-alt-btn">
                    <i class="fas fa-user-graduate"></i> Student
                </a>
                <a href="{% url 'register_teacher' %}" class="lf-auth-alt-btn">
                    <i class="fas fa-chalkboard-teacher"></i> Teacher
                </a>
            </div>
            <p class="lf-auth-link-row lf-auth-disabled">
                <i class="fas fa-question-circle"></i> Forgot Password? (Coming Soon)
            </p>
        </div>
    </div>
</div>
{% endblock %}
